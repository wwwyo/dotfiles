<!-- Hallmark · component: button · canonical markup (default state)
     The same markup serves all 8 states — only data-state / disabled / aria-* change.
     data-state: (none) · loading · error · success
     disabled: the disabled attribute (+ label stays 『保存』 per design.md)
     aria-busy="true" while loading · aria-live region for error copy lives in the page. -->
<button type="button" class="save-button" id="save">
  <span class="save-button__spinner" aria-hidden="true"></span>
  <span class="save-button__glyph save-button__glyph--retry" aria-hidden="true">
    <svg class="save-button__icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
  </span>
  <span class="save-button__glyph save-button__glyph--check" aria-hidden="true">
    <svg class="save-button__icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
  </span>
  <span class="save-button__label">
    <span class="save-button__copy" data-copy="idle">保存</span>
    <span class="save-button__copy" data-copy="loading">保存中…</span>
    <span class="save-button__copy" data-copy="error">再試行</span>
    <span class="save-button__copy" data-copy="success">保存済み</span>
  </span>
</button>
