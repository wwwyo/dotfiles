<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NoteShelf</title><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="button.css"><main><h1>調査メモ</h1><p id="memo">保存操作の確認用ページ。</p><button type="button" class="save-button" id="save"><span class="save-button__spinner" aria-hidden="true"></span><span class="save-button__glyph save-button__glyph--retry" aria-hidden="true"><svg class="save-button__icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></span><span class="save-button__glyph save-button__glyph--check" aria-hidden="true"><svg class="save-button__icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span><span class="save-button__label"><span class="save-button__copy" data-copy="idle">保存</span><span class="save-button__copy" data-copy="loading">保存中…</span><span class="save-button__copy" data-copy="error">再試行</span><span class="save-button__copy" data-copy="success">保存済み</span></span></button><output id="count">0</output></main><script>let count=0;document.querySelector('#save').addEventListener('click',()=>{document.querySelector('#count').value=String(++count)});</script></html>
