# daily-end の orca automation desired state。bot "me"（旧名 assist）の automation として走る。
# `.agents/scheduled-tasks/tools/sync_automations.py check` で drift を検出できる。
# skill 本体は wwwyo/me repo の .agents/skills/daily-end/ にある

name = "daily-end"
bot = "me"
# personal データを扱う task なので、bot の既定 agent ではなく従来どおり pi で走らせる。
# --agent は runs_in = "new" が必須 (orca 側制約)。モデル・thinking は delegate の
# worker/personal に従い Orca Settings → Agents の pi 起動引数に指定する。
agent = "pi"
runs_in = "new"
results_to = "chat"
enabled = true
timezone = "Asia/Tokyo"

trigger = "daily"
time = "23:00"

# bot は自分のフォルダ (~/.orca/bots/assist、bot 名を変えてもフォルダ名は変わらない) で走り cwd を選べない。prompt で移動させる。
# username 非依存にするため ~ 形式。sync 側で展開して {{workdir}} に入れる
workdir = "~/src/github.com/wwwyo/me"

# project automation の頃は terminal を残す目的で reuse_session = true にしていた
# (reuse しないと run 終了時に Orca が terminal を回収する)。bot automation は
# reuse_session を持てず、runs_in = "new" で毎回新しい会話になる。結果は bot の chat に残る

# bot フォルダで起動した agent は wwwyo/me の project skill・AGENTS.md を自動では読まない
# (pi は起動 cwd から探す) ので、prompt でパスを明示する
prompt = """
作業ディレクトリ {{workdir}} に移動し、以降のコマンドはすべてそこで実行する。{{workdir}}/AGENTS.md と {{workdir}}/.agents/skills/daily-end/SKILL.md を読み、その daily-end skill の手順で実行する。今日の分がすでに実行済みなら skip する。これは無人の scheduled 実行なので、振り返り質問・回答待ちは行わず、end.md に「対話なし」と記す。
"""
