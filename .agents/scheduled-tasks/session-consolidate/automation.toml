# session-consolidate の orca automation desired state。
# `.agents/scheduled-tasks/tools/sync_automations.py apply` で upsert する。
# merge 前に apply すると ~/.agents 経由で SKILL.md が無い状態で走るので、
# 有効化は PR merge 後の sync で行う前提。

name = "session-consolidate"
# personal データを扱う task。モデル・thinking は delegate の worker/personal に従い
# Orca Settings → Agents の pi 起動引数に指定する（automation CLI に model flag は無い）。
provider = "pi"
enabled = true
timezone = "Asia/Tokyo"

# 毎日 20:00 — 36h の探索窓内で次の run が対象を拾えるようにする。
trigger = "0 20 * * *"

# 既存 workspace で回す（新 worktree/run ではない）。
# username 非依存にするため ~ 形式。sync 側で展開して path:<abs> を渡す
workspace_path = "~/src/github.com/wwwyo/me"

# sentinel は自己ループ防止に必須 — 削らない。
# session_consolidate.py の SENTINEL と consolidator-prompt.md にも
# 同一 literal がある（3 箇所同時に変える）。eval sentinel の併記は
# この batch の session が日次 eval に評価されないためのもの — 無いと
# 記録 comment が付いて翌週の対象に戻る
prompt = """
dotfiles の ~/.agents/scheduled-tasks/session-consolidate/SKILL.md に従って session consolidate batch を実行する。sentinel: session-consolidate-batch:5d1e8b4a / session-eval-batch:9f3a2c7e。対象 0 件・閾値未満の見送り・lock 取得失敗は正常終了。
"""
