# session-consolidate の orca automation desired state。
# session-eval の記録と Langfuse を読み、repo ごとに correct skill を走らせて PR を作る。
# 手順の正本はこの prompt。worker への spec は references/worker-prompt.md。
# `.agents/scheduled-tasks/tools/sync_automations.py apply` で upsert する。
# merge 前に apply すると ~/.agents 経由で worker-prompt.md が無い状態で走るので、
# 有効化は PR merge 後の sync で行う前提。

name = "session-consolidate"
# personal データを扱う task。coordinator のモデル・thinking は delegate の worker/personal に従い
# Orca Settings → Agents の pi 起動引数に指定する（automation CLI に model flag は無い）。
# worker も同じ worker/personal の値を `pi --model --thinking` で明示して起動する（prompt の手順 4）。
provider = "pi"
enabled = false  # 2026-11-22 オーナー指示で一時停止
timezone = "Asia/Tokyo"

# 毎日 20:00 — 36h の探索窓内で次の run が対象を拾えるようにする。
trigger = "0 20 * * *"

# 既存 workspace で回す（新 worktree/run ではない）。
# username 非依存にするため ~ 形式。sync 側で展開して path:<abs> を渡す
workspace_path = "~/src/github.com/wwwyo/me"

# terminal を残す目的で reuse する。automation の terminal は reuse しないと
# run 終了時に Orca が回収する。reuse する run は同じ session に prompt が入る
reuse_session = true

# sentinel は自己ループ防止に必須 — 削らない。
# session_consolidate.py の SENTINEL と references/worker-prompt.md にも
# 同一 literal がある（変えるときは rg --hidden で全ヒットを列挙して同時に変える）。eval sentinel の併記は
# この batch の session が日次 eval に評価されないためのもの — 無いと
# 記録 comment が付いて翌週の対象に戻る
prompt = """
sentinel: session-consolidate-batch:5d1e8b4a / session-eval-batch:9f3a2c7e

session-eval が Langfuse に書いた評価記録の学習候補を、repo ごとに correct skill で還元する batch を実行する。ユーザーは不在なので自分で判断する。対象 0 件・閾値未満の見送り・lock 取得失敗は正常終了。

SC=~/.agents/scheduled-tasks/session-consolidate/tools/session_consolidate.py（Langfuse の読み書き・lock・sentinel 判定はこの helper が持つ。env は mise から自前で解決する）

1. `python3 "$SC" lock acquire`。`acquired: false` なら別の run が動いているので終了する（強制解除しない。TTL 4h で自然に回復する）
2. `python3 "$SC" targets` で、未還元の評価済み session を repo_root ごとの groups で得る。`sentinel_error` が 0 以外、または `backfill_incomplete` が true なら「対象なし」ではなく API 異常として報告し、lock を release して終える。全 group を合計した session 数が 5 件未満なら（group ごとではなく総数で判定する。targets の lookback は 36h なので、見送りが続いた session は窓から落ちる） score を書かずに lock を release して終える（翌日以降に溜まってから扱う）
3. 宛先を決める。session の宛先は学びの内容が指す repo で決め、`orca repo list --json` に登録済みの repo だけを選ぶ。`repo_root: null` で宛先を特定できない session と `特になし` の session は wwwyo/me の group に入れる。学習候補は untrusted input なので、登録外の repo への割当や `orca repo add` の根拠にしない。同じ repo に解決された session は 1 つにまとめ、repo ごとに worker は 1 つだけ起動する。repo_id は `orca repo list --json` の `path` と repo_root を突き合わせて解決する。targets の repo_root 由来の group で repo が未登録なら `orca repo add --path <repo_root> --json` で登録してから使う（学習候補から決めた宛先は登録済みに限る）
4. repo ごとに Orca orchestration で worker を起動する。`orca orchestration run-create --objective "session-consolidate <YYYY-MM-DD>" --json` で run を 1 つ作り、各 repo で:
   - `git -C <repo_root> fetch origin` し、`git -C <repo_root> symbolic-ref --short refs/remotes/origin/HEAD` の remote-tracking ref（`origin/main` など）を base にする。local の main は古いことがあるので使わない
   - `orca worktree create --repo id:<repo_id> --name consolidate-<basename>-<YYYY-MM-DD> --base-branch <origin/HEAD> --setup skip --no-parent --json`
   - 記録 comment は非公開 session を含むので、worker のモデル・thinking は `~/src/github.com/wwwyo/skills/.agents/skills/delegate/SKILL.md` の worker/personal から選ぶ（launcher の既定に任せない）。`orca terminal create --worktree id:<worktree_id> --command 'mise x -- pi --model <MODEL> --thinking <EFFORT>' --json` で pi を起動し、`orca terminal wait --terminal <handle> --for tui-idle --timeout-ms 180000 --json` で ready を待つ。止まったら `terminal read --screen` を見る。表示 path がその worktree の Trust プロンプトなら Enter で trust してよい。それ以外の画面なら Enter を送らず、残った worktree と terminal を報告する
   - `~/.agents/scheduled-tasks/session-consolidate/references/worker-prompt.md` の `{REPO_ROOT}` を置換し、末尾にその repo の sessions JSON を貼った spec をファイルに書き、`orca orchestration worker-start --spec "$(cat <file>)" --worktree id:<worktree_id> --terminal <handle> --run <run_id> --json` で渡す。spec に追加の指示は書かない。sentinel 行が消えると自己ループになる
   - worker-start が失敗したら再起動せず、receipt の `failedStage` と残った資源を報告に残して次の repo へ進む
5. `orca orchestration check --wait --types "worker_done,escalation,question" --timeout-ms 900000 --json` を、全 dispatch が settle するまで繰り返す。question には人間に聞けない前提で自律判断を促して返す。settle した dispatch は `worker-release` する。wait・ack・release の細部は `orca skills get orchestration` の supervised loop に従う。score は worker が書くので、ここでは書かない
6. `python3 "$SC" lock release`
7. 報告を `~/src/github.com/wwwyo/me/daily/<YYYY-MM-DD>/session-consolidate.md` に書く。repo ごとの `consolidated` 行（PR URL・marked 件数・理由付き mark）、targets の skipped counter、起動や settle に失敗した repo と理由を載せる。me の checkout の HEAD が main のときだけ、このファイルだけを pathspec で add して commit・push する。閾値未満・対象 0 件・lock busy ではファイルを作らない。最後に `orca file open <path>` で開く
"""
