# daily-start の orca automation desired state。bot "me"（旧名 assist）の automation として走る。
# `.agents/scheduled-tasks/tools/sync_automations.py check` で drift を検出できる。
# skill 本体は wwwyo/me repo の .agents/skills/daily-start/ にある

name = "daily-start"
bot = "me"
# runs_in = "chat" で bot の Home Chat の続きとして走らせる (2026-11-23 本人決定)。
# chat 実行は「そのチャットの agent の続き」になるため agent/model/effort は指定できない
# (orca 側制約: "A run in a chat continues on that chat's agent")。Home Chat は claude
# なので、daily-start は claude で走る。以前は pi + runs_in = "new" だったが、run 終了で
# チャットタブが閉じられ bot のサイドバーから消えるため chat に寄せた。
runs_in = "chat"
results_to = "chat"
enabled = true
timezone = "Asia/Tokyo"

trigger = "daily"
time = "08:00"

# bot は自分のフォルダ (~/.orca/bots/assist、bot 名を変えてもフォルダ名は変わらない) で走り cwd を選べない。prompt で移動させる。
# username 非依存にするため ~ 形式。sync 側で展開して {{workdir}} に入れる
workdir = "~/src/github.com/wwwyo/me"

# project automation の頃は terminal を残す目的で reuse_session = true にしていた
# (reuse しないと run 終了時に Orca が terminal を回収する)。bot automation は
# reuse_session を持てない。runs_in = "chat" の run は Home Chat に積まれるので、
# 毎朝の出力が Home Chat に残る (その分 Home Chat は長くなる)

# bot フォルダで起動した agent は wwwyo/me の project skill・AGENTS.md を自動では読まない
# (pi は起動 cwd から探す) ので、prompt でパスを明示する
prompt = """
作業ディレクトリ {{workdir}} に移動し、以降のコマンドはすべてそこで実行する。{{workdir}}/AGENTS.md と {{workdir}}/.agents/skills/daily-start/SKILL.md を読み、その daily-start skill の手順で実行する。今日の todo.md がすでに作成済みなら skip する。
"""
