# daily-start の orca automation desired state（既存登録を manifest に転記したもの）。
# `.agents/scheduled-tasks/tools/sync_automations.py check` で drift を検出できる。
# skill 本体は wwwyo/me repo の .agents/skills/daily-start/ にある

name = "daily-start"
# personal データを扱う task。モデル・thinking は delegate の worker/personal に従い
# Orca Settings → Agents の pi 起動引数に指定する（automation CLI に model flag は無い）。
provider = "pi"
enabled = true
timezone = "Asia/Tokyo"

trigger = "daily"
time = "08:00"

# username 非依存にするため ~ 形式。sync 側で展開して path:<abs> を渡す
workspace_path = "~/src/github.com/wwwyo/me"

prompt = """
daily-start skill を実行する。今日の todo.md がすでに作成済みなら skip する。作業ディレクトリは {{workspace_path}}。
"""
