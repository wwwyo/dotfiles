          GH_AW_PROMPT_CONTENT_0003: "<github-context>\nThe following GitHub context information is available for this workflow:\n{{#if github.actor}}\n- **actor**: __GH_AW_GITHUB_ACTOR__\n{{/if}}\n{{#if github.repository}}\n- **repository**: __GH_AW_GITHUB_REPOSITORY__\n{{/if}}\n{{#if github.workspace}}\n- **workspace**: __GH_AW_GITHUB_WORKSPACE__\n{{/if}}\n{{#if github.event.issue.number || (github.aw.context.item_type == 'issue' && github.aw.context.item_number)}}\n- **issue-number**: #__GH_AW_EXPR_802A9F6A__\n{{/if}}\n{{#if github.event.discussion.number || (github.aw.context.item_type == 'discussion' && github.aw.context.item_number)}}\n- **discussion-number**: #__GH_AW_EXPR_1A3A194A__\n{{/if}}\n{{#if github.event.pull_request.number || (github.aw.context.item_type == 'pull_request' && github.aw.context.item_number)}}\n- **pull-request-number**: #__GH_AW_EXPR_463A214A__\n{{/if}}\n{{#if github.event.comment.id || github.aw.context.comment_id}}\n- **comment-id**: __GH_AW_EXPR_FF1D34CE__\n{{/if}}\n{{#if github.run_id}}\n- **workflow-run-id**: __GH_AW_GITHUB_RUN_ID__\n{{/if}}\n- **checkouts**: The following repositories have been checked out and are available in the workspace:\n  - repo `__GH_AW_GITHUB_REPOSITORY__` → `__GH_AW_GITHUB_WORKSPACE__` (cwd) [full history, all branches available as remote-tracking refs]\n  - **Note**: The workspace path reported above may contain a separate shallow, credential-free checkout of the host repository. Use the exact checkout path shown for the repository you need. Before concluding that a branch is unavailable, confirm your working directory matches that path and inspect refs there. If the branch is not present in that checkout and is not listed as an additional fetched ref, it has NOT been checked out. For private repositories you cannot fetch it. If the branch is required and not available, exit with an error and ask the user to add it to the `fetch:` option of the `checkout:` configuration (e.g., `fetch: [\"refs/pulls/open/*\"]` for all open PR refs, or `fetch: [\"main\", \"feature/my-branch\"]` for specific branches).\n  - **Warning: No git credentials are available to the agent.** Credentials are\n    intentionally removed after the checkout step for security. This means any git\n    operation that needs to authenticate to the remote will fail. In private repositories, that includes:\n    - `git fetch`, `git pull`, `git clone`, and `git push` (direct push, not via safe-output tools)\n    - Checking out or switching to a remote branch that is not already fetched\n    - Deepening a shallow clone (`git fetch --unshallow`)\n    - On-demand blob fetches in partial/blobless clones (operations on files not in the initial checkout)\n    Do NOT attempt to configure credentials, run `git credential fill`, or modify `.gitconfig` —\n    authentication will not succeed. If you encounter credential prompts or authentication errors,\n    stop immediately and report the limitation rather than spending turns trying to work around it.\n</github-context>\n\n"
          GH_AW_PROMPT_CONTENT_0004: "</system>\n"
          GH_AW_PROMPT_CONTENT_0005: "{{#runtime-import .github/workflows/shared/skillctrl-engine.md}}\n"
          GH_AW_PROMPT_CONTENT_0006: "{{#runtime-import .github/workflows/skillctrl-update.md}}\n"
        with:
          script: |
            const { setupGlobals } = require(process.env.GH_AW_ACTIONS_DIR + '/setup_globals.cjs');
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(process.env.GH_AW_ACTIONS_DIR + '/create_prompt.cjs');
            await main(core);
      - name: Interpolate variables and render templates
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_PROMPT: ${{ runner.temp }}/gh-aw/aw-prompts/prompt.txt
          GH_AW_ENGINE_ID: "skillctrl-engine"
        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'interpolate_prompt.cjs'));
            await main();
      - name: Substitute placeholders
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_PROMPT: ${{ runner.temp }}/gh-aw/aw-prompts/prompt.txt
          GH_AW_EXPR_1A3A194A: ${{ github.event.discussion.number || (fromJSON(github.event.inputs.aw_context || github.event.client_payload.aw_context || '{}').item_type == 'discussion' && fromJSON(github.event.inputs.aw_context || github.event.client_payload.aw_context || '{}').item_number) }}
          GH_AW_EXPR_463A214A: ${{ github.event.pull_request.number || (fromJSON(github.event.inputs.aw_context || github.event.client_payload.aw_context || '{}').item_type == 'pull_request' && fromJSON(github.event.inputs.aw_context || github.event.client_payload.aw_context || '{}').item_number) }}
          GH_AW_EXPR_802A9F6A: ${{ github.event.issue.number || (fromJSON(github.event.inputs.aw_context || github.event.client_payload.aw_context || '{}').item_type == 'issue' && fromJSON(github.event.inputs.aw_context || github.event.client_payload.aw_context || '{}').item_number) }}
          GH_AW_EXPR_FF1D34CE: ${{ github.event.comment.id || fromJSON(github.event.inputs.aw_context || github.event.client_payload.aw_context || '{}').comment_id }}
          GH_AW_GITHUB_ACTOR: ${{ github.actor }}
          GH_AW_GITHUB_REPOSITORY: ${{ github.repository }}
          GH_AW_GITHUB_RUN_ID: ${{ github.run_id }}
          GH_AW_GITHUB_WORKSPACE: ${{ github.workspace }}
          GH_AW_MCP_CLI_SERVERS_LIST: '- `safeoutputs` — run `safeoutputs --help` to see available tools'
          GH_AW_NEEDS_PRE_ACTIVATION_OUTPUTS_ACTIVATED: ${{ needs.pre_activation.outputs.activated }}
        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);

            const substitutePlaceholders = require(path.join(actionsDir, 'substitute_placeholders.cjs'));

            // Call the substitution function
            return await substitutePlaceholders({
              file: process.env.GH_AW_PROMPT,
              substitutions: {
                GH_AW_EXPR_1A3A194A: process.env.GH_AW_EXPR_1A3A194A,
                GH_AW_EXPR_463A214A: process.env.GH_AW_EXPR_463A214A,
                GH_AW_EXPR_802A9F6A: process.env.GH_AW_EXPR_802A9F6A,
                GH_AW_EXPR_FF1D34CE: process.env.GH_AW_EXPR_FF1D34CE,
                GH_AW_GITHUB_ACTOR: process.env.GH_AW_GITHUB_ACTOR,
                GH_AW_GITHUB_REPOSITORY: process.env.GH_AW_GITHUB_REPOSITORY,
                GH_AW_GITHUB_RUN_ID: process.env.GH_AW_GITHUB_RUN_ID,
                GH_AW_GITHUB_WORKSPACE: process.env.GH_AW_GITHUB_WORKSPACE,
                GH_AW_MCP_CLI_SERVERS_LIST: process.env.GH_AW_MCP_CLI_SERVERS_LIST,
                GH_AW_NEEDS_PRE_ACTIVATION_OUTPUTS_ACTIVATED: process.env.GH_AW_NEEDS_PRE_ACTIVATION_OUTPUTS_ACTIVATED
              }
            });
      - name: Validate prompt placeholders
        env:
          GH_AW_PROMPT: ${{ runner.temp }}/gh-aw/aw-prompts/prompt.txt
        run: |
          bash "${RUNNER_TEMP}/gh-aw/actions/validate_prompt_placeholders.sh"
      - name: Print prompt
        env:
          GH_AW_PROMPT: ${{ runner.temp }}/gh-aw/aw-prompts/prompt.txt
        run: |
          bash "${RUNNER_TEMP}/gh-aw/actions/print_prompt_summary.sh"
      - name: Upload info artifact
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: info
          path: /tmp/gh-aw/aw_info.json
          if-no-files-found: ignore
      - name: Stage prompt files for artifact upload
        run: |
          mkdir -p /tmp/gh-aw/aw-prompts
          cp -a "${RUNNER_TEMP}/gh-aw/aw-prompts/." /tmp/gh-aw/aw-prompts/
      - name: Upload activation artifact
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: activation
          include-hidden-files: true
          path: |
            /tmp/gh-aw/aw_info.json
            /tmp/gh-aw/models.json
            /tmp/gh-aw/aw-prompts/prompt.txt
            /tmp/gh-aw/aw-prompts/prompt-template.txt
            /tmp/gh-aw/aw-prompts/prompt-import-tree.json
            /tmp/gh-aw/github_rate_limits.jsonl
            /tmp/gh-aw/base
            /tmp/gh-aw/.github/agents
            /tmp/gh-aw/.github/skills
          if-no-files-found: ignore
          retention-days: 1

  agent:
    needs:
      - activation
      - record
      - select
    if: >
      ((always() && !cancelled() && needs.select.result == 'success' && needs.select.outputs.changed == 'true' &&
      needs.select.outputs.review == 'true' && needs.select.outputs.authenticated == 'true') && (needs.activation.outputs.daily_ai_credits_exceeded != 'true')) &&
      ((!cancelled() && needs.activation.result == 'success') && (needs.activation.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: "gh-aw-skillctrl-engine-${{ github.workflow }}"
      queue: max
    timeout-minutes: 60
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_AW_ASSETS_ALLOWED_EXTS: ""
      GH_AW_ASSETS_BRANCH: ""
      GH_AW_ASSETS_MAX_SIZE_KB: 0
      GH_AW_MCP_LOG_DIR: /tmp/gh-aw/mcp-logs/safeoutputs
      GH_AW_PR_HEAD_BASE_BRANCH: ""
      GH_AW_PR_HEAD_BASE_PR_NUMBER: ""
      GH_AW_PR_HEAD_BASE_REF: ""
      GH_AW_PR_HEAD_BASE_REPO: ""
      GH_AW_PR_HEAD_BASE_SHA: ""
      GH_AW_PR_HEAD_REPO: ""
      GH_AW_RUNTIME_FEATURES: ${{ vars.GH_AW_RUNTIME_FEATURES }}
      GH_AW_WORKFLOW_ID_SANITIZED: skillctrlupdate
    outputs:
      ai_credits_rate_limit_error: ${{ steps.parse-mcp-gateway.outputs.ai_credits_rate_limit_error || 'false' }}
      aic: ${{ steps.parse-token-usage.outputs.aic }}
      ambient_context: ${{ steps.parse-token-usage.outputs.ambient_context }}
      checkout_pr_success: ${{ steps.checkout-pr.outputs.checkout_pr_success || 'true' }}
      has_patch: ${{ steps.collect_output.outputs.has_patch }}
      model: ${{ needs.activation.outputs.model }}
      output: ${{ steps.collect_output.outputs.output }}
      output_types: ${{ steps.collect_output.outputs.output_types }}
      setup-parent-span-id: ${{ steps.setup.outputs.parent-span-id || steps.setup.outputs.span-id }}
      setup-span-id: ${{ steps.setup.outputs.span-id }}
      setup-trace-id: ${{ steps.setup.outputs.trace-id }}
      unknown_model_ai_credits: ${{ steps.parse-mcp-gateway.outputs.unknown_model_ai_credits || 'false' }}
    steps:
      - name: Setup Scripts
        id: setup
        uses: github/gh-aw-actions/setup@924af5fdc64061cfbf66fb584c8b07e2ac230c60 # v0.89.21
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
          job-name: ${{ github.job }}
          trace-id: ${{ needs.activation.outputs.setup-trace-id }}
          parent-span-id: ${{ needs.activation.outputs.setup-parent-span-id || needs.activation.outputs.setup-span-id }}
        env:
          GH_AW_SETUP_WORKFLOW_NAME: "Skillctrl Update"
          GH_AW_CURRENT_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/skillctrl-update.lock.yml@${{ github.ref }}
          GH_AW_INFO_ENGINE_ID: "skillctrl-engine"
      - name: Set runtime paths
        id: set-runtime-paths
        env:
          GH_AW_RUNNER_TOOL_CACHE: ${{ runner.tool_cache }}
        run: | # zizmor: ignore[github-env] - runner.tool_cache is set by GitHub Actions, not user input.
          if [ -z "${RUNNER_TOOL_CACHE:-}" ]; then
            echo "RUNNER_TOOL_CACHE=${GH_AW_RUNNER_TOOL_CACHE}" >> "$GITHUB_ENV"
          fi
          {
            echo "GH_AW_SAFE_OUTPUTS=${RUNNER_TEMP}/gh-aw/safeoutputs/outputs.jsonl"
            echo "GH_AW_SAFE_OUTPUTS_CONFIG_PATH=${RUNNER_TEMP}/gh-aw/safeoutputs/config.json"
            echo "GH_AW_SAFE_OUTPUTS_TOOLS_PATH=${RUNNER_TEMP}/gh-aw/safeoutputs/tools.json"
          } >> "$GITHUB_OUTPUT"
      - name: Mask OTLP telemetry headers
        run: bash "${RUNNER_TEMP}/gh-aw/actions/mask_otlp_headers.sh"
      - name: Check OTLP telemetry configuration
        run: bash "${RUNNER_TEMP}/gh-aw/actions/check_otlp_default_credentials.sh"
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Initialize agent execution evidence
        run: |
          mkdir -p "/tmp/gh-aw"
          evidence_tmp="/tmp/gh-aw/agent_execution.json.tmp"
          printf '{"version":1,"component":"agent","run_id":%s,"run_attempt":%s,"state":"not_started"}\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$evidence_tmp"
          mv "$evidence_tmp" "/tmp/gh-aw/agent_execution.json"
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: false
      - name: Capture GOROOT for AWF chroot mode
        run: echo "GOROOT=$(go env GOROOT)" >> "$GITHUB_ENV"
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '${{ needs.select.outputs.node }}'
          package-manager-cache: false
      - name: Create gh-aw temp directory
        run: bash "${RUNNER_TEMP}/gh-aw/actions/create_gh_aw_tmp_dir.sh"
      - name: Configure gh CLI for GitHub Enterprise
        run: bash "${RUNNER_TEMP}/gh-aw/actions/configure_gh_for_ghe.sh"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Download activation artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: activation
          path: /tmp/gh-aw
      - env:
          CHECKER_SOURCE: ${{ needs.select.outputs.source }}
        name: Read the trusted skillctrl pin
        run: "mkdir -p /tmp/gh-aw/skillctrl-cli\npython3 - <<'PYTHON'\nimport json, os, re, subprocess, tomllib\nfrom pathlib import Path\nsource = os.environ['CHECKER_SOURCE']\nif not re.fullmatch(r'[0-9a-f]{40}', source):\n    raise ValueError('trusted source must be a commit')\nconfig = tomllib.loads(subprocess.check_output(['git', 'show', source + ':home/dot_config/mise/config.toml'], text=True))\npin = config['tools']['go:github.com/wwwyo/skillctrl']\nif not isinstance(pin, str) or not re.fullmatch(r'[0-9a-f]{40}', pin):\n    raise ValueError('trusted skillctrl version must be an exact commit pin')\ntoolchain = config['tools']['go']\nif not isinstance(toolchain, str) or not re.fullmatch(r'[0-9]+\\.[0-9]+\\.[0-9]+', toolchain):\n    raise ValueError('trusted go toolchain must be an exact pin')\nlines = ['[tools]', '\"go:github.com/wwwyo/skillctrl\" = ' + json.dumps(pin), 'go = ' + json.dumps(toolchain), '', '[settings]']\nfor name in ['pin', 'minimum_release_age']:\n    lines.append(name + ' = ' + json.dumps(config['settings'][name]))\nPath('/tmp/gh-aw/skillctrl-cli/mise.toml').write_text('\\n'.join(lines) + '\\n')\nPath('/tmp/gh-aw/skillctrl-cli/global.toml').write_text('')\nnode = config['tools'].get('node', '')\nPath('/tmp/gh-aw/skillctrl-cli/node.txt').write_text(str(node))\npi = config['tools'].get('npm:@earendil-works/pi-coding-agent', '')\nPath('/tmp/gh-aw/skillctrl-cli/pi.txt').write_text(str(pi))\nlock_text = subprocess.check_output(['git', 'show', source + ':home/dot_config/mise/mise.lock'], text=True)\nselected_blocks = []\nfor tool, version in [('go:github.com/wwwyo/skillctrl', pin), ('go', toolchain)]:\n    name = json.dumps(tool) if ':' in tool else tool\n    blocks = re.findall(r'(?ms)^\\[\\[tools\\.' + re.escape(name) + r'\\]\\]\\n.*?(?=^\\[\\[tools\\.|\\Z)', lock_text)\n    matching = [block for block in blocks if tomllib.loads(block)['tools'][tool][0]['version'] == version]\n    if len(matching) != 1:\n        raise ValueError(f'trusted {tool} lock must match the exact pin')\n    selected_blocks.append(matching[0])\nPath('/tmp/gh-aw/skillctrl-cli/mise.lock').write_text(''.join(selected_blocks))\nPYTHON\n"
      - env:
          MISE_DATA_DIR: /tmp/gh-aw/skillctrl-cli/data
          MISE_GLOBAL_CONFIG_FILE: /tmp/gh-aw/skillctrl-cli/global.toml
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          add_shims_to_path: false
          cache: false
          env: false
          export_path: false
          version: 2026.9.12
          working_directory: /tmp/gh-aw/skillctrl-cli
      - env:
          MISE_DATA_DIR: /tmp/gh-aw/skillctrl-cli/data
          MISE_GLOBAL_CONFIG_FILE: /tmp/gh-aw/skillctrl-cli/global.toml
        id: skillctrl-cli
        name: Bind the trusted skillctrl executable
        run: |
          binary="$(mise which skillctrl)"
          echo "SKILLCTRL_BIN=$binary" >> "$GITHUB_ENV"
          echo "binary=$binary" >> "$GITHUB_OUTPUT"
        working-directory: /tmp/gh-aw/skillctrl-cli
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: skillctrl-input
          path: /tmp/gh-aw/skillctrl/input
      - env:
          CHECKER_SOURCE: ${{ needs.select.outputs.source }}
          SKILL_PLAN: ${{ needs.select.outputs.plan }}
        name: Prepare immutable selection and trusted validator
        run: "mkdir -p /tmp/gh-aw/skillctrl/pi\nprintf '%s' \"$SKILL_PLAN\" > /tmp/gh-aw/skillctrl/plan.json\nprintf '%s' \"$CHECKER_SOURCE\" > /tmp/gh-aw/skillctrl/source.txt\ngit show \"$CHECKER_SOURCE:home/dot_pi/agent/models.json\" > /tmp/gh-aw/skillctrl/pi/models.json\npython3 - <<'PYTHON'\nimport json, os, subprocess, tomllib\nfrom pathlib import Path\nsource = os.environ['CHECKER_SOURCE']\nconfig = tomllib.loads(subprocess.check_output(['git', 'show', source + ':home/dot_config/mise/config.toml'], text=True))\ntools = {'node': config['tools']['node'],\n         'npm:@earendil-works/pi-coding-agent': config['tools']['npm:@earendil-works/pi-coding-agent']}\nlines = ['[tools]'] + [json.dumps(k) + ' = ' + json.dumps(v) for k, v in tools.items()]\nlines += ['', '[settings]']\nfor name in ['pin', 'minimum_release_age']:\n    lines.append(name + ' = ' + json.dumps(config['settings'][name]))\nPath('/tmp/gh-aw/skillctrl/mise.toml').write_text('\\n'.join(lines) + '\\n')\nPYTHON\n"
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          add_shims_to_path: false
          cache: false
          env: true
          version: 2026.9.12
          working_directory: /tmp/gh-aw/skillctrl
      - env:
          EXPECTED_NODE: ${{ needs.select.outputs.node }}
        id: trusted-toolchain
        name: Bind the agent runtime to the trusted mise pin
        run: |
          node="$(mise which node)"
          test "$("$node" --version)" = "v$EXPECTED_NODE"
          echo "node=$node" >> "$GITHUB_OUTPUT"
        working-directory: /tmp/gh-aw/skillctrl

      - name: Configure Git credentials
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "${RUNNER_TEMP}/gh-aw/actions/configure_git_credentials.sh"
      - name: Checkout PR branch
        id: checkout-pr
        if: |
          github.event.pull_request || github.event.issue.pull_request || github.event_name == 'workflow_dispatch' && fromJSON(github.event.inputs.aw_context || '{}').item_type == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_TOKEN: ${{ secrets.GH_AW_GITHUB_MCP_SERVER_TOKEN || secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          github-token: ${{ secrets.GH_AW_GITHUB_MCP_SERVER_TOKEN || secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'checkout_pr_branch.cjs'));
            await main();
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install AWF binary
        run: bash "${RUNNER_TEMP}/gh-aw/actions/install_awf_binary.sh" v0.28.23 --rootless
      - name: Determine automatic lockdown mode for GitHub MCP Server
        id: determine-automatic-lockdown
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 (source v9)
        env:
          GH_AW_GITHUB_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN }}
          GH_AW_GITHUB_MCP_SERVER_TOKEN: ${{ secrets.GH_AW_GITHUB_MCP_SERVER_TOKEN }}
        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const determineAutomaticLockdown = require(path.join(actionsDir, 'determine_automatic_lockdown.cjs'));
            await determineAutomaticLockdown(github, context, core);
      - name: Restore agent config folders from base branch
        if: steps.checkout-pr.outcome == 'success'
        env:
          GH_AW_AGENT_FOLDERS: ".agents .github"
          GH_AW_AGENT_FILES: "AGENTS.md"
        run: bash "${RUNNER_TEMP}/gh-aw/actions/restore_base_github_folders.sh"
      - name: Restore inline sub-agents from activation artifact
        env:
          GH_AW_SUB_AGENT_DIR: ".github/agents"
          GH_AW_SUB_AGENT_EXT: ".agent.md"
        run: bash "${RUNNER_TEMP}/gh-aw/actions/restore_inline_sub_agents.sh"
      - name: Restore inline skills from activation artifact
        env:
          GH_AW_SKILL_DIR: ".github/skills"
